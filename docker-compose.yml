services:
  php-fpm:
    image: pplulee/sidetp:latest
    volumes:
      - ./web:/var/www/html
      - .env:/var/www/html/.env
      - ./data/entrypoint.sh:/entrypoint.sh
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appleautopro-network
    healthcheck:
      test: ["CMD", "test", "-f", "/var/run/php/php-fpm.pid"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: always
    logging:
      options:
        max-size: "3m"
        max-file: "2"

#  caddy:
#    image: caddy:latest
#    ports:
#      - "80:80"
#      - "443:443"
#    volumes:
#      - ./data/Caddyfile:/etc/caddy/Caddyfile
#      - ./data/caddy/data:/data
#      - ./data/caddy:/config
#      - ./web:/var/www/html
#    depends_on:
#      php-fpm:
#        condition: service_healthy
#    networks:
#      - appleautopro-network
#    restart: always
#    logging:
#      options:
#        max-size: "3m"
#        max-file: "2"

  nginx:
    image: nginx:latest
    ports:
      - "127.0.0.1:${WEB_PORT}:80"
#      - "[::1]:${WEB_PORT}:80"
    volumes:
      - ./data/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/var/www/html
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - appleautopro-network
    restart: always
    logging:
      options:
        max-size: "3m"
        max-file: "2"

  redis:
    image: redis:latest
    # 前后端分离部署时，请取消以下注释内容，并在env文件中设置redis密码
#    env_file:
#      - .env
#    command: redis-server --requirepass "${REDIS_PASSWORD}" --bind 0.0.0.0
#    ports:
#      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - appleautopro-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always
    logging:
      options:
        max-size: "3m"
        max-file: "2"

  mariadb:
    image: mariadb:latest
    env_file:
      - .env
    volumes:
      - ./data/mariadb/data:/var/lib/mysql
      - ./data/mariadb/conf:/etc/mysql/conf.d
    networks:
      - appleautopro-network
    restart: always
    healthcheck:
      test: [ "CMD", "mariadb-admin", "-h", "localhost", "-u${MARIADB_USER}", "-p${MARIADB_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "3m"
        max-file: "2"

  # 前后端分离部署时，请注释backend服务
  backend:
    image: pplulee/appleautopro:v4
    env_file:
      - .env
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - appleautopro-network
    restart: always
    deploy:
      replicas: ${BACKEND_THREADS}
    logging:
      options:
        max-size: "3m"
        max-file: "2"

networks:
  appleautopro-network:
    driver: bridge
